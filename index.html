<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QUANTBIT Terminal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root">
      <noscript>QUANTBIT membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</noscript>
      <div id="boot-fallback" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0f;color:#a3a3a3;font-family:system-ui;font-size:14px;z-index:9999;transition:opacity .3s">
        <div style="text-align:center">
          <div style="font-size:24px;font-weight:700;color:#e5e5e5;margin-bottom:8px">QUANTBIT</div>
          <div>Memuat terminal...</div>
        </div>
      </div>
    </div>
    <script>
      // If this element is still visible after 8s, JS failed to execute/mount.
      window.__bootFallback = document.getElementById('boot-fallback');
      setTimeout(function() {
        if (window.__bootFallback && window.__bootFallback.parentNode) {
          window.__bootFallback.innerHTML = '<div style="text-align:center;color:#ef4444"><div style="font-size:24px;font-weight:700;margin-bottom:8px">QUANTBIT</div><div style="color:#ef4444;margin-bottom:8px">Gagal memuat.</div><div style="font-size:12px;color:#737373">Kosongkan cache (Ctrl+Shift+R) atau coba mode Incognito.</div></div>';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
